[package]
name = "airzone26"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AirZone 26 - full mastering suite (VST3 / CLAP)"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
airzone-dsp = { path = "../airzone-dsp" }
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683" }
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683" }
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hound = "3.5"

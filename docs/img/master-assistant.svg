<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" font-family="Segoe UI,Helvetica,Arial,sans-serif"><title>Master Assistant (illustration)</title><rect width="640" height="340" rx="8" fill="#181b21"/><text x="16" y="28" font-size="16" fill="#40d6be" font-weight="bold">Master Assistant</text><text x="16" y="48" font-size="11" fill="#8c94a0" >It guides, you decide: review the notes, then apply or undo.</text><rect x="16" y="58" width="150" height="22" rx="4" fill="#222630" /><text x="24" y="74" font-size="11" fill="#e6e9ee" >Genre: Pop  v</text><rect x="176" y="58" width="190" height="22" rx="4" fill="#222630" /><text x="184" y="74" font-size="11" fill="#e6e9ee" >Target: Streaming -14 LUFS  v</text><rect x="16" y="90" width="160" height="26" rx="4" fill="#40d6be" /><text x="28" y="108" font-size="12" fill="#000" >Start listening</text><text x="190" y="108" font-size="11" fill="#8c94a0" >Play the loudest chorus for 10-30 seconds.</text><text x="16" y="138" font-size="13" fill="#40d6be" font-weight="bold">Measurements</text><text x="16" y="156" font-size="10" fill="#8c94a0" >Loudness -17.8 LUFS | LRA 6.1 LU | True peak -0.4 dBTP | PLR 17.4 dB | Width 31% | Corr. +0.62</text><text x="16" y="178" font-size="13" fill="#40d6be" font-weight="bold">Suggestions</text><text x="16" y="198" font-size="11" fill="#e6e9ee" >- EQ: 24 Hz high-pass removes rumble that wastes limiter headroom</text><text x="16" y="216" font-size="11" fill="#e6e9ee" >- EQ: overall balance is 1.3 dB/oct brighter than a typical Pop master, -2.9 dB high shelf at 3 kHz</text><text x="16" y="234" font-size="11" fill="#e6e9ee" >- Dynamics: PLR 17.4 dB is very dynamic, gentle 2.2:1 control below -22 dB</text><text x="16" y="252" font-size="11" fill="#e6e9ee" >- Bass Control: sub band summed to mono for translation</text><text x="16" y="270" font-size="11" fill="#e6e9ee" >- Maximizer: +3.8 dB to move from -17.8 to -14.0 LUFS, ceiling -1.0 dBTP, mode AZ-2 Balanced</text><rect x="16" y="300" width="170" height="26" rx="4" fill="#5ad278" /><text x="28" y="318" font-size="12" fill="#000" >Apply suggestions</text><rect x="196" y="300" width="70" height="26" rx="4" fill="#222630" /><text x="210" y="318" font-size="12" fill="#e6e9ee" >Undo</text><circle cx="380" cy="69" r="11" fill="#ffaa46"/><text x="376" y="73" font-size="12" fill="#000" font-weight="bold">1</text><circle cx="200" cy="103" r="11" fill="#ffaa46"/><text x="196" y="107" font-size="12" fill="#000" font-weight="bold">2</text><circle cx="500" cy="160" r="11" fill="#ffaa46"/><text x="496" y="164" font-size="12" fill="#000" font-weight="bold">3</text><circle cx="110" cy="313" r="11" fill="#ffaa46"/><text x="106" y="317" font-size="12" fill="#000" font-weight="bold">4</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" width="640" height="230" font-family="Segoe UI,Helvetica,Arial,sans-serif"><title>Pitch Correction panel (illustration)</title><rect width="640" height="230" rx="8" fill="#181b21"/><text x="16" y="26" font-size="16" fill="#40d6be" font-weight="bold">Pitch Correction</text><text x="180" y="26" font-size="11" fill="#8c94a0" >Mode: Vocal  v</text><text x="16" y="48" font-size="11" fill="#5ad278" >Pitch found in 86% of the audio; current correction +18 cents.</text><rect x="16" y="58" width="520" height="70" rx="4" fill="#101216" /><text x="30" y="100" font-size="34" fill="#40d6be" >A4</text><text x="30" y="120" font-size="11" fill="#8c94a0" >+31 cents   441.6 Hz</text><text x="190" y="92" font-size="24" fill="#ffaa46" >-> A4</text><text x="190" y="116" font-size="11" fill="#8c94a0" >shift -18 cents</text><line x1="330" y1="93" x2="520" y2="93" stroke="#8c94a0" stroke-width="1"/><line x1="425" y1="81" x2="425" y2="105" stroke="#8c94a0" stroke-width="1"/><circle cx="451" cy="93" r="6" fill="#eb5050"/><circle cx="415" cy="93" r="5" fill="#5ad278"/><text x="16" y="148" font-size="11" fill="#e6e9ee" >Key  C  v     Scale  Major  v     [Detect key from audio]    Likely key: C major (r = 0.84)</text><text x="16" y="176" font-size="11" fill="#8c94a0" >Retune Speed</text><rect x="150" y="166" width="200" height="10" rx="4" fill="#101216" /><rect x="150" y="166" width="100" height="10" rx="4" fill="#40d6be" /><text x="360" y="176" font-size="11" fill="#e6e9ee" >90 ms</text><text x="16" y="196" font-size="11" fill="#8c94a0" >Correction Amount</text><rect x="150" y="186" width="200" height="10" rx="4" fill="#101216" /><rect x="150" y="186" width="120" height="10" rx="4" fill="#40d6be" /><text x="360" y="196" font-size="11" fill="#e6e9ee" >100 %</text><text x="16" y="216" font-size="11" fill="#8c94a0" >Preserve Vibrato</text><rect x="150" y="206" width="200" height="10" rx="4" fill="#101216" /><rect x="150" y="206" width=